[workspace]
authors = ["vshekar1 <vshekar1@bnl.gov>"]
channels = ["conda-forge"]
name = "lsdc"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.fmx-gui]
cmd = "./bin/fmx_env.sh && cd \"$INIT_CWD\" && setsid -f python /nsls2/software/mx/daq/lsdc_fmx/lsdcGui.py"

[tasks.fmx-remote]
cmd = "./bin/fmx_env.sh && cd \"$INIT_CWD\" && ipython -i /nsls2/software/mx/daq/lsdc_fmx/daq_mainAux.py"

[tasks.fmx-server]
cmd = "./bin/fmx_env.sh && cd \"$INIT_CWD\" && ipython -i /nsls2/software/mx/daq/lsdc_fmx/server.py"

[tasks.amx-gui]
cmd = "./bin/amx_env.sh && cd \"$INIT_CWD\" && setsid -f python /nsls2/software/mx/daq/lsdc_amx/lsdcGui.py"

[tasks.amx-remote]
cmd = "./bin/amx_env.sh && cd \"$INIT_CWD\" && ipython -i /nsls2/software/mx/daq/lsdc_amx/daq_mainAux.py"

[tasks.amx-server]
cmd = "./bin/amx_env.sh && cd \"$INIT_CWD\" && ipython -i /nsls2/software/mx/daq/lsdc_amx/server.py"

[dependencies]
python = ">=3.13.5,<3.14"
qtpy = ">=2.4.3,<3"
requests = ">=2.32.4,<3"
amostra = "==0.2.4"
conftrak = ">=0.0.9,<0.0.10"
analysisstore = ">=0.0.6,<0.0.7"
pyqt = ">=5.15.11,<6"
ipython = ">=9.7.0,<10"
ophyd = ">=1.11.0,<2"
xmltodict = ">=1.0.2,<2"
# mxtools = ">=1.0.4,<2"
super_state_machine = ">=2.0.2,<3"
databroker = ">=2.0.0b68,<3"
nslsii = ">=0.11.4,<0.12"
scikit-learn = ">=1.7.2,<2"
glib = ">=2.86.1,<3"
pymca = ">=5.9.4,<6"
qt_epics = ">=0.0.4,<0.0.5"
pydantic = ">=2.12.5,<3"
tiled = ">=0.2.13,<0.3"
bluesky-tiled-plugins = ">=2.0.6,<3"

[pypi-dependencies]
opencv-python-headless = ">=4.11.0.86, <5"
summarytable = ">=0.1.8, <0.2"
mxtools = { git = "https://github.com/vshekar/mxtools", branch = "add-raster-assets" }
# mxtools = { path = "../mxtools", editable = true }
